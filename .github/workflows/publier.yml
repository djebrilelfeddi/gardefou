# À chaque envoi sur la branche main, GitHub :
# 1. donne un nouveau numéro de version (1.0.<numéro de publication>),
# 2. l'écrit dans l'appli, le service worker et version.json,
# 3. publie le tout sur GitHub Pages.
# Les téléphones voient le nouveau version.json et se mettent à jour.
name: Publier GardeFou

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          DATE=$(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')
          NOTES=$(git log -1 --pretty=%s | cut -c1-140)
          mkdir -p _site
          cp -r index.html config.js sw.js manifest.webmanifest icons _site/
          sed -i "s/__APP_VERSION__/$VERSION/g" _site/index.html _site/sw.js
          jq -n --arg v "$VERSION" --arg d "$DATE" --arg n "$NOTES" '{version:$v, date:$d, notes:$n}' > _site/version.json
          touch _site/.nojekyll
          echo "Version publiée : $VERSION"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
