<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10243E">
<title>GardeFou, prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:wght@700&display=swap">
<style>
/* =====================================================================
   CHARTE GARDEFOU : couleurs, polices, tailles
   ===================================================================== */
:root{
  --nuit:#10243E;--nuit2:#18345A;--ambre:#F2A33A;--ocre:#BF6A00;--ocreTxt:#8A4B00;
  --creme:#FAF5EC;--sable:#F1E8D6;--trait:#E3DACA;--brume:#C5CFDD;--ardoise:#3D5068;
  --rouge:#B42318;--rougeF:#7A1710;--os:#1B1F24;--os2:#2A3038;--scrim:#4A525E;--banque:#24477A;
  --E:cubic-bezier(.2,.8,.2,1);
  --sat:0px;--sab:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;color:var(--nuit);background:#E7E1D6;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit}
p,h1,h2{margin:0}
.display{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-0.018em}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}.g20{gap:20px}
.muted{color:var(--ardoise)}
.small{font-size:17px;line-height:22px}

/* ---------- cadre : écran d'ordinateur ou vrai téléphone ---------- */
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.desk{display:flex;flex-direction:column;align-items:center;gap:16px;transform-origin:center center;flex-shrink:0}
.pair{display:flex;gap:56px;align-items:flex-start}
.device{display:flex;flex-direction:column;align-items:center;gap:12px}
.caption{font-size:18px;font-weight:700;color:var(--ardoise)}
.deskbar{display:flex;gap:20px;align-items:center}
.phone{position:relative;width:390px;height:844px;border-radius:50px;border:11px solid #14171B;background:var(--creme);overflow:hidden;box-shadow:0 26px 60px rgba(16,36,62,.28);isolation:isolate;transform:translateZ(0)}
.full .phone{position:fixed;inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
.full{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}

/* ---------- barre d'état et barre de navigation (faux Android) ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:calc(34px + var(--sat));padding:var(--sat) 24px 0;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;z-index:30;transition:background-color .3s,color .3s;font-variant-numeric:tabular-nums}
.sb .ic{display:flex;gap:6px;align-items:center}
.nb{position:absolute;bottom:0;left:0;right:0;height:calc(48px + var(--sab));padding-bottom:var(--sab);display:flex;align-items:center;justify-content:space-around;z-index:30;transition:background-color .3s,color .3s}
.nb button{all:unset;cursor:pointer;width:72px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:24px}
.nb button:active{background:rgba(127,127,127,.18)}
.stage{position:absolute;top:calc(34px + var(--sat));bottom:calc(48px + var(--sab));left:0;right:0;overflow:hidden}
.layer{position:absolute;inset:0;will-change:transform,opacity;backface-visibility:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:var(--creme);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
[data-sb=creme] .sb,[data-nb=creme] .nb{background:var(--creme);color:var(--nuit)}
[data-sb=nuit] .sb,[data-nb=nuit] .nb{background:var(--nuit);color:var(--creme)}
[data-sb=rouge] .sb,[data-nb=rouge] .nb{background:var(--rouge);color:#fff}
[data-sb=os] .sb,[data-nb=os] .nb{background:var(--os);color:#fff}
[data-sb=white] .sb,[data-nb=white] .nb{background:#fff;color:var(--os)}
[data-sb=scrim] .sb{background:var(--scrim);color:#fff}
[data-sb=banque] .sb{background:var(--banque);color:#fff}

/* ---------- composants de la charte ---------- */
.pad{padding:24px 20px 32px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;min-height:64px;border-radius:18px;font-size:21px;font-weight:700;padding:10px 16px;line-height:26px;transition:transform .12s,filter .12s}
.btn:active,.big:active,.chip:active,.step:active,.appi:active .tile,.row-btn:active{transform:scale(.97)}
.btn.nuit{background:var(--nuit);color:var(--creme)}
.btn.ambre{background:var(--ambre);color:var(--nuit)}
.btn.blanc{background:#fff;border:2px solid var(--nuit);color:var(--nuit)}
.btn.blancR{background:#fff;color:#8F1B13}
.btn.ligneB{border:3px solid #fff;color:#fff}
.btn.ligneC{border:2px solid var(--creme);color:var(--creme)}
.big{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:96px;padding:16px 18px;background:#fff;border:2px solid var(--nuit);border-radius:20px;display:flex;align-items:center;gap:16px;transition:transform .12s}
.big .t{font-size:23px;line-height:28px;font-weight:700;display:block}
.big .s{font-size:17px;line-height:22px;color:var(--ardoise);display:block}
.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:18px;line-height:24px;font-weight:500;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid var(--trait);border-radius:20px;padding:18px}
.navycard{background:var(--nuit);color:var(--creme);border-radius:24px;padding:22px}
.banner{background:var(--ambre);color:var(--nuit);border-radius:16px;padding:12px 14px;font-size:18px;line-height:24px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.chip{all:unset;cursor:pointer;box-sizing:border-box;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid var(--trait);font-size:18px;line-height:24px;font-weight:500;display:flex;align-items:center;gap:12px;transition:transform .12s}
.chip.dark{background:var(--os2);border-color:#454C57;color:#fff}
.icirc{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lab{font-size:18px;font-weight:700}
textarea{font:inherit;font-size:20px;line-height:28px;width:100%;min-height:170px;border:2px solid var(--nuit);border-radius:16px;padding:14px;background:#fff;color:var(--nuit);resize:none}
input[type=text]{font:inherit;font-size:20px;width:100%;min-height:56px;border:2px solid var(--nuit);border-radius:14px;padding:8px 14px;background:#fff;color:var(--nuit)}
textarea:focus,input:focus{outline:3px solid var(--ambre);outline-offset:1px}
button:focus-visible{outline:3px solid var(--ambre);outline-offset:3px}
.badge{font-size:17px;font-weight:700;color:#2F5E99;display:flex;align-items:center;gap:6px}
.badge i{width:9px;height:9px;border-radius:5px;background:#2F5E99;display:block}
.badge.off{color:var(--ardoise)}.badge.off i{background:#9AA5B4}

/* la pastille : le seul élément qui flotte par-dessus les autres applis */
.float{position:absolute;right:14px;display:flex;align-items:center;gap:10px;z-index:5}
.float .tip{background:var(--nuit);color:var(--creme);font-size:18px;font-weight:700;padding:10px 14px;border-radius:16px;box-shadow:0 4px 14px rgba(16,36,62,.25)}
.float.oncall .tip{background:var(--creme);color:var(--nuit)}
.bulle{all:unset;cursor:pointer;box-sizing:border-box;width:76px;height:76px;border-radius:38px;background:var(--nuit);border:3px solid var(--ambre);box-shadow:0 6px 18px rgba(16,36,62,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:pulse 1.8s ease-in-out infinite;transition:transform .12s}
.bulle:active{transform:scale(.92)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,163,58,.6)}50%{box-shadow:0 0 0 14px rgba(242,163,58,0)}}
.float{animation:floatIn .5s var(--E) both .25s;touch-action:none}
.float .tip{transition:opacity .35s ease,transform .35s ease}
.float.notip .tip{opacity:0;transform:scale(.85)}
.float.dragging .bulle{animation:none;transform:scale(1.08);box-shadow:0 12px 28px rgba(16,36,62,.45)}
.float.snap{transition:left .28s var(--E),top .28s var(--E)}
.bulle{touch-action:none}
.gear{all:unset;cursor:pointer;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:-8px -8px -8px 0}
.gear:active{background:var(--sable)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--trait)}
.chk:last-child{border-bottom:0}
.chk .ci{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk .ct{font-size:19px;line-height:24px;font-weight:700}
.chk .cs{font-size:15px;font-weight:700;margin-left:4px}
.chk .cd{font-size:17px;line-height:23px;margin-top:2px}
.morelink{all:unset;cursor:pointer;align-self:flex-start;display:flex;gap:6px;align-items:center;font-size:18px;font-weight:700;color:var(--nuit);text-decoration:underline;text-underline-offset:3px;min-height:44px}
@keyframes floatIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* feuilles, notifications, messages éphémères */
.sheetwrap{position:absolute;inset:0;background:rgba(16,36,62,.45);z-index:40;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .22s both}
.sheetwrap.out{animation:fadeOut .22s both}
.sheet{background:var(--creme);border-radius:26px 26px 0 0;padding:22px 20px 26px;display:flex;flex-direction:column;gap:12px;max-height:94%;overflow-y:auto}
.sheetwrap .sheet{animation:sheetUp .36s var(--E) both}
.sheetwrap.out .sheet{animation:sheetDown .22s ease-in both}
.grab{width:44px;height:5px;border-radius:3px;background:#CFC6B5;align-self:center;margin:-8px 0 4px}
.demohead{font-size:17px;font-weight:700;color:var(--ardoise)}
.toast{position:absolute;left:16px;right:16px;bottom:22px;background:var(--nuit);color:var(--creme);border-radius:16px;padding:14px 16px;font-size:18px;line-height:24px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .22s,transform .22s var(--E),visibility .22s;z-index:60;pointer-events:none}
.toast.on{opacity:1;visibility:visible;transform:none}
.hun{position:absolute;left:10px;right:10px;top:8px;z-index:45;background:#fff;color:var(--os);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;animation:hunIn .5s var(--E) both}
.hun.out{animation:hunOut .3s ease-in both}
.hun .ap{font-size:15px;color:#57606A;display:flex;align-items:center;gap:6px}
.hun .tt{font-size:18px;font-weight:700;line-height:24px}
.hun .tx{font-size:17px;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hun.urgent{background:var(--nuit);color:var(--creme)}.hun.urgent .ap{color:var(--ambre)}
.callpill{all:unset;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:44;cursor:pointer;background:#1E7B34;color:#fff;border-radius:22px;padding:9px 18px;font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:pillIn .4s var(--E) both;white-space:nowrap}
@keyframes pillIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translateX(-50%)}}

/* animations d'entrée des écrans */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes hunIn{from{transform:translateY(-140%)}to{transform:none}}
@keyframes hunOut{to{transform:translateY(-140%);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes hl{0%{background:#FDE3BA}100%{background:transparent}}
.enter .stg>*{animation:rise .45s var(--E) both}
.enter .stg>*:nth-child(2){animation-delay:.05s}.enter .stg>*:nth-child(3){animation-delay:.1s}.enter .stg>*:nth-child(4){animation-delay:.15s}.enter .stg>*:nth-child(5){animation-delay:.2s}.enter .stg>*:nth-child(6){animation-delay:.25s}.enter .stg>*:nth-child(7){animation-delay:.3s}.enter .stg>*:nth-child(n+8){animation-delay:.35s}
.enter .scrimtop{animation:fadeIn .3s both}
.enter .sheet.rise{animation:sheetUp .42s var(--E) both}
.enter .stopword{animation:pop .55s var(--E) both .08s}
.enter .hand{animation:wave .55s ease-in-out .4s 2;transform-origin:50% 85%}
.drop{animation:slideDown .4s var(--E) both}
.hist.new{animation:hl 2.4s ease-out both}

/* chargement et analyse */
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--trait);border-top-color:var(--nuit);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:center;gap:4px;height:24px}
.bars span{width:4px;border-radius:2px;background:var(--ocre);animation:eq 1s ease-in-out infinite}
.bars span:nth-child(2){animation-delay:.2s}.bars span:nth-child(3){animation-delay:.4s}.bars span:nth-child(4){animation-delay:.6s}
@keyframes eq{0%,100%{height:8px}50%{height:22px}}
.dots span{display:inline-block;width:8px;height:8px;border-radius:4px;background:#C9CED6;margin:0 4px;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* faux système : écran d'accueil, messages, appels, banque */
.launcher{background:var(--nuit);color:#fff;padding:56px 24px 28px;align-items:stretch}
.clock{font-size:76px;line-height:80px;font-weight:500;letter-spacing:-0.02em;text-align:center;font-variant-numeric:tabular-nums}
.date{font-size:20px;text-align:center;color:var(--brume);margin-top:6px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;margin-top:auto}
.appi{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.appi .tile{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .12s}
.appi .lbl{font-size:15px;color:#fff;text-align:center;line-height:18px;white-space:nowrap}
.appi .bdg{position:absolute;top:-6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--rouge);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid var(--nuit)}
.os{background:#fff;color:var(--os)}
.oshead{padding:20px 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E1E4E8;flex-shrink:0}
.row-btn{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:14px;align-items:center;padding:14px 20px;width:100%;transition:transform .12s}
.av{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub{max-width:300px;background:#ECEFF3;border-radius:22px;padding:15px 18px;font-size:20px;line-height:28px;color:var(--os);animation:rise .4s var(--E) both}
.bub.me{align-self:flex-end;background:#D8E3F5}
.calltop{color:#fff;align-items:center;text-align:center;padding:52px 20px 28px;gap:8px}
.callav{width:112px;height:112px;border-radius:56px;background:#343A43;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;margin-bottom:10px}
.callav.ring{animation:ringPulse 1.5s ease-out infinite}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 36px rgba(255,255,255,0)}}
.ctl{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:#C9CED6;font-size:15px}
.ctl span.c{width:66px;height:66px;border-radius:33px;background:#343A43;display:flex;align-items:center;justify-content:center;transition:background .15s}
.ctl.on span.c{background:#E9EDF2}
.roundb{all:unset;cursor:pointer;width:80px;height:80px;border-radius:40px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.roundb:active{transform:scale(.92)}
.roundb.red{background:#D92D20}.roundb.green{background:#1E8E3E}
.roundb.green{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateY(-8px)}90%{transform:none}}

/* écran STOP */
.stop{background:var(--rouge);color:#fff;padding:28px 22px 24px;gap:18px}

/* écrans de l'aidante */
.hist{display:flex;gap:12px;padding:13px 8px;margin:0 -8px;border-bottom:1px solid #EDE5D6;border-radius:10px}
.hist:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;margin-top:5px}
.step{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:80px;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid var(--nuit);display:flex;align-items:center;gap:14px;transition:transform .12s,background .2s}
.step.done{background:var(--sable)}
.num{width:40px;height:40px;border-radius:20px;background:var(--nuit);color:var(--creme);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prog{display:flex;gap:8px;justify-content:center}
.prog i{width:10px;height:10px;border-radius:5px;background:var(--trait);display:block;transition:all .3s}
.prog i.on{width:28px;background:var(--ocre)}
.sysdlg{background:#fff;color:var(--os);border-radius:28px;padding:24px 22px 16px;margin:0 22px;align-self:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .4s var(--E) both}
.sysdlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.sysdlg .acts button{all:unset;cursor:pointer;font-size:18px;font-weight:700;color:#2F5E99;padding:12px 14px;border-radius:20px}

/* écran d'accueil du prototype (choix du téléphone) */
.hub{background:var(--creme);border-radius:28px;padding:30px 26px;width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(16,36,62,.18);animation:rise .5s var(--E) both}
.splash{position:absolute;inset:0;z-index:80;background:var(--nuit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.splash.out{animation:fadeOut .35s both}
.splash path,.splash circle{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .9s var(--E) forwards}
.splash circle{stroke-dasharray:130;stroke-dashoffset:130}
.splash .wm{opacity:0;animation:rise .5s var(--E) .55s forwards;color:var(--creme);font-size:34px}
@keyframes draw{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* =====================================================================
   1. RÉGLAGES DE LA DÉMO : modifiez ici les noms, textes et chiffres
   ===================================================================== */
const CONFIG = {
  senior: {prenom:'Monique', surnom:'Maman'},          // « Maman » : comme Julie l'appelle

  }catch(e){ if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) sampleBlocked=true; return local; }
}

   ===================================================================== */
function makePhone(host, handlers){
  host.innerHTML = `<div class="sb"><span data-clock></span><span class="ic">${SBICONS}</span></div><div class="stage"></div>
    <div class="nb"><button type="button" data-nav="back" aria-label="Retour">${ICON.navBack('currentColor')}</button><button type="button" data-nav="home" aria-label="Écran d’accueil">${ICON.navHome('currentColor')}</button><button type="button" data-nav="menu" aria-label="Commandes de démonstration">${ICON.navMenu('currentColor')}</button></div>`;
  const stage = host.querySelector('.stage');
  const clock = host.querySelector('[data-clock]');
  const tick = ()=>{ clock.textContent=hhmm(Date.now()); }; tick(); setInterval(tick, 5000);
  host.querySelector('.nb').addEventListener('click', e=>{ const b=e.target.closest('[data-nav]'); if(!b) return; const h=handlers[b.dataset.nav]; if(h) h(); });
  let cur=null, toastEl=null, toastT=null, hunEl=null, hunT=null, sheetEl=null, pillEl=null;

  function animate(old, neu, type){
    const D = REDUCED?0:(type==='fade'?220:340);
    const o = {duration:D, easing:'cubic-bezier(.2,.8,.2,1)', fill:'both'};
    let a=null, b=null;
    if(type==='push'){ b=[{transform:'translateX(100%)'},{transform:'translateX(0)'}]; a=[{transform:'none',filter:'brightness(1)'},{transform:'translateX(-28%)',filter:'brightness(.82)'}]; }
    else if(type==='back'){ if(old) old.style.zIndex=2; b=[{transform:'translateX(-28%)',filter:'brightness(.82)'},{transform:'none',filter:'brightness(1)'}]; a=[{transform:'none'},{transform:'translateX(100%)'}]; }
    else if(type==='up'){ b=[{transform:'translateY(100%)'},{transform:'none'}]; a=[{opacity:1},{opacity:1}]; }
    else if(type==='down'){ if(old) old.style.zIndex=2; a=[{transform:'none'},{transform:'translateY(100%)'}]; b=[{opacity:1},{opacity:1}]; }
    else if(type==='fade'){ b=[{opacity:0},{opacity:1}]; a=[{opacity:1},{opacity:0}]; }
    else if(type==='open'){ b=[{opacity:0,transform:'scale(.86)'},{opacity:1,transform:'none'}]; a=[{opacity:1},{opacity:0}]; }
    else if(type==='close'){ if(old) old.style.zIndex=2; a=[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.86)'}]; b=[{opacity:.4},{opacity:1}]; }
    else if(type==='pop'){ b=[{opacity:0,transform:'scale(1.08)'},{opacity:1,transform:'none'}]; a=[{opacity:1},{opacity:1}]; }
    if(old){ old.style.pointerEvents='none'; if(a&&D) try{ old.animate(a,o); }catch(e){} setTimeout(()=>old.remove(), D+40); }
    if(b&&D) try{ neu.animate(b,o); }catch(e){}
  }
  return {
    host, stage,
    get cur(){ return cur; },
    theme(sb, nb){ host.dataset.sb=sb; host.dataset.nb=nb||sb; },
    show(html, anim){
      const layer=document.createElement('div'); layer.className='layer enter'; layer.innerHTML=html;
      stage.appendChild(layer); const old=cur; cur=layer;
      if(!old) anim='none';
      animate(old, layer, anim||'none');
      setTimeout(()=>layer.classList.remove('enter'), 1100);
      return layer;
    },
    refresh(html){
      if(!cur) return this.show(html,'none');
      const sc=cur.querySelector('.scr'); const top=sc?sc.scrollTop:0;
      cur.classList.remove('enter'); cur.innerHTML=html;
      const n=cur.querySelector('.scr'); if(n) n.scrollTop=top; return cur;
    },
    toast(t){ if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; toastEl.setAttribute('role','status'); stage.appendChild(toastEl);} toastEl.textContent=t; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),2800); },
    hun({app='Messages', icon='', title='', text='', urgent=false, ms=6000, onTap}){
      this.hideHun(true);
      const el=document.createElement('div'); el.className='hun'+(urgent?' urgent':''); el.setAttribute('role','status');
      el.innerHTML=`${icon}<div class="col g4" style="flex:1;min-width:0"><p class="ap"><span>${esc(app)}</span><span>· maintenant</span></p><p class="tt ellip">${esc(title)}</p><p class="tx">${esc(text)}</p></div>`;
      el.addEventListener('click',()=>{ this.hideHun(); if(onTap) onTap(); });
      stage.appendChild(el); hunEl=el; clearTimeout(hunT); hunT=setTimeout(()=>this.hideHun(), ms);
    },
    hideHun(now){ clearTimeout(hunT); const el=hunEl; hunEl=null; if(!el) return; if(now||REDUCED){ el.remove(); return; } el.classList.add('out'); setTimeout(()=>el.remove(),320); },
    sheet(html, label){
      this.closeSheet(true);
      const w=document.createElement('div'); w.className='sheetwrap'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true'); w.setAttribute('aria-label',label||'');
      w.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
      w.addEventListener('click',e=>{ if(e.target===w) this.closeSheet(); });
      stage.appendChild(w); sheetEl=w; return w;
    },
    closeSheet(now){ const w=sheetEl; sheetEl=null; if(!w) return; if(now||REDUCED){ w.remove(); return; } w.classList.add('out'); setTimeout(()=>w.remove(),240); },
    sheetOpen(){ return !!sheetEl; },
    pill(text, onTap){
      if(!text){ if(pillEl){ pillEl.remove(); pillEl=null; } return; }
      if(!pillEl){ pillEl=document.createElement('button'); pillEl.type='button'; pillEl.className='callpill'; pillEl.addEventListener('click',()=>{ if(pillEl&&pillEl._tap) pillEl._tap(); }); stage.appendChild(pillEl); }
      pillEl._tap=onTap; pillEl.innerHTML=ICON.phone('#fff',18)+'<span>'+esc(text)+'</span>';
    },
    splash(done){
      const sp=document.createElement('div'); sp.className='splash'; sp.setAttribute('aria-hidden','true');
      sp.innerHTML=LOGO('#FAF5EC','#F2A33A',66,89)+'<p class="display wm">GardeFou</p>';
      host.appendChild(sp); host.dataset.sb='nuit'; host.dataset.nb='nuit';
      const D=REDUCED?50:1250;
      setTimeout(()=>{ done(); sp.classList.add('out'); setTimeout(()=>sp.remove(),380); }, D);
    }
  };
}

/* la pastille : déplaçable, collée au bord le plus proche, sa place est retenue */
function attachBulle(layer, o){
  const H=layer.clientHeight, W=layer.clientWidth, B=76, M=14;
  const el=document.createElement('div'); el.className='float'+(o.oncall?' oncall':'')+(o.tip?'':' notip'); el.dataset.float='1';
  el.innerHTML=(o.tip?`<p class="tip">${esc(o.tip)}</p>`:'')+`<button type="button" class="bulle" data-act="${o.act}" aria-label="${esc(o.label)}">${LOGO('#FAF5EC','#F2A33A',o.oncall?30:32,o.oncall?40:43)}</button>`;
  const KEY='bulle-'+(o.key||'msg'), MIN=o.minTop||8, MAX=H-B-(o.bottomGap||8);
  let pos=null; try{ pos=JSON.parse(store.get(KEY,'null')); }catch(e){}
  let side=(pos&&pos.side)||'right';
  let top=Math.round(pos&&typeof pos.y==='number' ? pos.y*H : (o.defTop||H*0.35));
  top=Math.max(MIN, Math.min(MAX, top));
  const tipEl=()=>el.querySelector('.tip');
  function place(){
    el.style.top=top+'px';
    if(tipEl()){ el.style.flexDirection= side==='right'?'row':'row-reverse'; if(side==='right'){ el.style.right=M+'px'; el.style.left='auto'; } else { el.style.left=M+'px'; el.style.right='auto'; } }
    else { el.style.right='auto'; el.style.left=(side==='right'?W-M-B:M)+'px'; }
  }
  place(); layer.appendChild(el);
  const dropTip=()=>{ const t=tipEl(); if(!t) return; el.classList.add('notip'); setTimeout(()=>{ if(t.parentNode){ t.remove(); place(); } }, 360); };
  if(o.tip) setTimeout(dropTip, 2000);                    // la bulle d'aide ne reste que 2 secondes
  const b=el.querySelector('.bulle');
  let down=false, moved=false, sx=0, sy=0, bx=0, by=0, k=1;
  b.addEventListener('pointerdown', e=>{
    down=true; moved=false; sx=e.clientX; sy=e.clientY;
    const lr=layer.getBoundingClientRect(), br=b.getBoundingClientRect(); k=lr.width/layer.offsetWidth||1;
    bx=(br.left-lr.left)/k; by=(br.top-lr.top)/k;
    try{ b.setPointerCapture(e.pointerId); }catch(err){}
  });
  b.addEventListener('pointermove', e=>{
    if(!down) return;
    const dx=(e.clientX-sx)/k, dy=(e.clientY-sy)/k;
    if(!moved){ if(Math.hypot(dx,dy)<8) return; moved=true; const t=tipEl(); if(t) t.remove(); el.classList.add('notip','dragging'); el.classList.remove('snap'); el.style.flexDirection='row'; el.style.right='auto'; }
    const x=Math.max(0, Math.min(W-B, bx+dx)); top=Math.max(MIN, Math.min(MAX, by+dy));
    el.style.left=x+'px'; el.style.top=top+'px';
  });
  const end=e=>{
    if(!down) return; down=false;
    if(!moved) return;
    const x=parseFloat(el.style.left)||0; side = (x+B/2) < W/2 ? 'left' : 'right';
    el.classList.remove('dragging'); el.classList.add('snap'); place();
    store.set(KEY, JSON.stringify({side, y: top/H}));
    b.dataset.dragged='1'; setTimeout(()=>{ delete b.dataset.dragged; }, 80);
  };
  b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
  b.addEventListener('click', e=>{ if(b.dataset.dragged){ e.stopPropagation(); e.preventDefault(); } }, true);
  return el;
}

function createSenior(host, send){

    word:CONFIG.codeFamille, showWord:false, dejaDone:{}, verifyText:'', linked:false, call:null, stopType:null, overlay:false, analysingNote:'', history:[]};
  let callTimer=null, analyseTimer=null, ringTimer=null, answerTimer=null;
  const P = makePhone(host, {back, home:goHome, menu:openDemo});
  const THEME = {launcher:['nuit'], inbox:['white'], sms:['white'], dialer:['white'], analysing:['scrim','creme'], verdict:['scrim','creme'], ring:['os'], outcall:['os'], call:['os'], stop:['rouge'], bank:['banque','white'], onb1:['nuit'], onb2:['creme'], onb3:['creme']};
  const MODAL = {analysing:1, verdict:1, ring:1, outcall:1, call:1};

  function resetConvos(){
    st.convos=[{id:'julie', name:A, sub:CONFIG.aidant.lien, known:true, msgs:[{text:CONFIG.messageJulie, at:Date.now()-26*3600e3}], unread:0}];
  }
  resetConvos();
  const unread = ()=>st.convos.reduce((n,c)=>n+c.unread,0);
  const convo = ()=>st.convos.find(c=>c.id===st.convoId);

  /* ---------- navigation ---------- */
  function render(anim){ const t=THEME[st.screen]||['creme']; P.theme(t[0], t[1]||t[0]); P.show(V[st.screen](), anim); after(true); syncPill(); }
  function refresh(){ P.refresh(V[st.screen]()); after(false); syncPill(); }
  function push(s, anim='push'){ st.stack.push(s); st.screen=s; render(anim); }
  function replaceTop(s, anim='fade'){ st.stack[st.stack.length-1]=s; st.screen=s; render(anim); }
  function resetTo(stack, anim='fade'){ st.stack=stack.slice(); st.screen=stack[stack.length-1]; render(anim); }
  function back(){
    if(P.sheetOpen()) return P.closeSheet();
    const s=st.screen;
    if(s==='ring'||s==='stop'||s.startsWith('onb')) return;
    if(s==='call'||s==='outcall'){ goHome(); return; }
    if(st.stack.length>1){ const top=st.stack.pop(); st.screen=st.stack[st.stack.length-1]; render(MODAL[top]?'down':'back'); }
  }
  function goHome(){
    if(P.sheetOpen()) P.closeSheet(true);
    if(st.screen==='ring'||st.screen==='stop'||st.screen.startsWith('onb')) return;
    if(st.screen==='launcher') return;
    resetTo(['launcher'], 'close');
  }
  function syncPill(){
    const c=st.call; const onCallScreen=['call','outcall','ring','stop'].includes(st.screen);
    if(c&&c.state!=='ring'&&!onCallScreen){ P.pill('Appel en cours · '+(c.start?mmss(Date.now()-c.start):'…'), ()=>{ push(c.start?'call':'outcall','up'); }); }
    else P.pill(null);
  }

  /* ---------- liens avec l'aidante ---------- */
  function record(e){ st.history.unshift({id:uid(), at:Date.now(), ...e}); if(st.history.length>30) st.history.pop(); }
  function alertAidant(type, detail){ send({kind:'alert', id:uid(), at:Date.now(), type, detail:(detail||'').slice(0,160)}); }

  /* ---------- éléments répétés ---------- */
  const badge = ()=>`<span class="badge${st.linked?'':' off'}" style="margin-left:auto"><i></i>${st.linked?'Relié à '+esc(A):'Non relié'}</span>`;
  const replyBanner = ()=> st.reply ? `<div class="banner drop" role="status" data-act="reply-ok" style="cursor:pointer">${ICON.bell('#10243E',24)}<span><span style="display:block">${esc(A)} vous écrit :</span><span style="display:block;font-weight:500">${esc(st.reply)}</span></span></div>` : '';

  /* ---------- les écrans ---------- */
  const V = {
    launcher:()=>{ const n=unread();
      return `<div class="scr launcher">
      <p class="clock" data-slot="bigclock">${hhmm(Date.now())}</p><p class="date">${esc(DATE_FR())}</p>
      <div class="apps stg">
        <button type="button" class="appi" data-act="open" data-arg="dialer"><span class="tile" style="background:#fff">${ICON.phone('#10243E',32)}</span><span class="lbl">Téléphone</span></button>
        <button type="button" class="appi" data-act="open" data-arg="inbox"><span class="tile" style="background:#fff">${ICON.bubble('#10243E',32)}</span><span class="lbl">Messages</span>${n?`<span class="bdg">${n}</span>`:''}</button>
        <button type="button" class="appi" data-act="open" data-arg="bank"><span class="tile" style="background:var(--banque)">${ICON.bank('#fff',32)}</span><span class="lbl">${esc(CONFIG.banque.nom)}</span></button>
        <button type="button" class="appi" data-act="open" data-arg="home"><span class="tile" style="overflow:hidden">${APPICON(64,true)}</span><span class="lbl">GardeFou</span></button>
      </div></div>`; },

    inbox:()=>`<div class="scr os">
      <div class="oshead" style="border-bottom:0"><h1 style="font-size:30px;line-height:36px">Messages</h1></div>
      <div class="col stg">${st.convos.map(c=>{ const m=c.msgs[c.msgs.length-1];
        return `<button type="button" class="row-btn" data-act="convo" data-arg="${esc(c.id)}"><span class="av" style="background:${c.known?'#E6ECF5':'#ECEFF3'};color:#2F5E99">${c.known?esc(c.name.charAt(0)):ICON.user('#57606A',28)}</span>
          <span class="col" style="flex:1;min-width:0"><span class="row" style="justify-content:space-between;gap:8px"><span class="ellip" style="font-size:19px;font-weight:${c.unread?700:500}">${esc(c.name)}</span><span style="font-size:15px;color:#57606A;flex-shrink:0">${c.msgs.length&&Date.now()-m.at<20*3600e3?hhmm(m.at):'Hier'}</span></span>
          <span class="ellip" style="font-size:17px;color:${c.unread?'#1B1F24':'#57606A'};font-weight:${c.unread?700:400}">${esc(m.text)}</span></span>${c.unread?'<span style="width:12px;height:12px;border-radius:6px;background:#2F5E99;flex-shrink:0"></span>':''}</button>`; }).join('')}</div></div>`,

    sms:()=>{ const c=convo(); if(!c) return V.inbox();
      return `<div class="scr os">
      <div class="oshead"><button type="button" class="link" data-act="back" aria-label="Retour" style="min-width:44px;margin-left:-10px">${ICON.back('#1B1F24')}</button>
        <div class="col"><p style="font-size:21px;font-weight:700">${esc(c.name)}</p><p style="font-size:15px;color:#57606A">${esc(c.sub)}</p></div></div>
      <div class="col g12" style="flex:1;padding:22px 16px 140px" data-msgs>
        <p style="align-self:center;font-size:15px;color:#57606A">${Date.now()-c.msgs[0].at<20*3600e3?'Aujourd’hui, '+hhmm(c.msgs[0].at):'Hier'}</p>
        ${c.msgs.map(m=>`<div class="bub${m.me?' me':''}">${esc(m.text)}</div>`).join('')}
      </div>
      <div style="position:sticky;bottom:0;padding:12px 16px 16px;background:#fff;border-top:1px solid #E1E4E8"><div style="height:52px;border:1px solid #C9CED6;border-radius:26px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:#57606A;font-size:18px">Message${ICON.send('#9AA3AE')}</div></div>
    </div>`; },

    dialer:()=>`<div class="scr os">
      <div class="oshead" style="border-bottom:0"><h1 style="font-size:30px;line-height:36px">Téléphone</h1></div>
      <p style="padding:4px 20px 8px;font-size:15px;color:#57606A;font-weight:700">Récents</p>
      <div class="col stg">
        <button type="button" class="row-btn" data-act="call-julie"><span class="av" style="background:var(--ambre);color:var(--nuit)">${esc(A.charAt(0))}</span><span class="col" style="flex:1"><span style="font-size:19px;font-weight:700">${esc(A)}</span><span style="font-size:17px;color:#57606A">${esc(CONFIG.aidant.lien)} · mobile</span></span>${ICON.phone('#1E7B34',26)}</button>
        <button type="button" class="row-btn" data-act="fake-call" data-arg="Pharmacie du Port"><span class="av" style="background:#ECEFF3;color:#2F5E99">P</span><span class="col" style="flex:1"><span style="font-size:19px;font-weight:700">Pharmacie du Port</span><span style="font-size:17px;color:#57606A">Hier</span></span>${ICON.phone('#1E7B34',26)}</button>
        <button type="button" class="row-btn" data-act="fake-call" data-arg="Dr Martin"><span class="av" style="background:#ECEFF3;color:#2F5E99">M</span><span class="col" style="flex:1"><span style="font-size:19px;font-weight:700">Dr Martin</span><span style="font-size:17px;color:#57606A">Lundi</span></span>${ICON.phone('#1E7B34',26)}</button>
      </div></div>`,

    bank:()=>`<div class="scr" style="background:#F3F5F8;color:#14243A">
      <div style="background:var(--banque);color:#fff;padding:22px 20px 70px" class="col g6"><div class="row g10">${ICON.bank('#fff',28)}<p style="font-size:21px;font-weight:700">${esc(CONFIG.banque.nom)}</p></div><p style="font-size:18px;margin-top:10px;opacity:.85">Bonjour ${esc(S)}</p></div>
      <div class="col g16" style="padding:0 18px 24px;margin-top:-52px">
        <div class="card stg" style="border:0;box-shadow:0 8px 24px rgba(20,36,58,.12)"><p style="font-size:17px;color:#57606A">Compte courant</p><p style="font-size:34px;line-height:42px;font-weight:700">${esc(CONFIG.banque.solde)}</p></div>
        <div class="col g10 stg">
          <button type="button" class="chip" data-act="bank-op">${ICON.arrows('#24477A')}<span>Faire un virement</span></button>
          <button type="button" class="chip" data-act="bank-op">${ICON.card('#24477A')}<span>Mes cartes</span></button>
          <button type="button" class="chip" data-act="bank-op">${ICON.bank('#24477A',26)}<span>Mes comptes</span></button>
        </div>
        <p style="font-size:15px;color:#57606A">Application bancaire fictive, pour la démonstration.</p>
      </div></div>`,

    home:()=>`<div class="scr pad col g18">
      <div class="row g12" style="min-height:48px">${LOGO('#10243E','#BF6A00',31,42)}<p class="display" style="font-size:28px">GardeFou</p>${badge()}</div>
      ${replyBanner()}
      <div class="col g18 stg">
      <button type="button" class="navycard row g16" data-act="push" data-arg="hist" style="all:unset;box-sizing:border-box;cursor:pointer;background:var(--nuit);color:var(--creme);border-radius:24px;padding:22px;display:flex;align-items:center;gap:16px;width:100%">
        <div class="icirc" style="background:var(--ambre)">${st.history.length?ICON.warn('#10243E',30):ICON.check('#10243E',32)}</div>
        <div class="col g4" style="flex:1"><p class="display" style="font-size:28px;line-height:34px">${st.history.length?'Vous avez été protégée':'Tout va bien'}</p><p style="font-size:19px;color:var(--brume)">${st.history.length?(st.history.length===1?'1 alerte aujourd’hui.':st.history.length+' alertes aujourd’hui.'):'Aucune alerte aujourd’hui.'}</p></div>
        ${ICON.chev('#FAF5EC',24)}
      </button>
      <button type="button" class="big" data-act="push" data-arg="verify">${ICON.msg('#10243E')}<span><span class="t">Vérifier un message</span><span class="s">Collez un message douteux</span></span></button>
      <button type="button" class="big" data-act="call-julie">${ICON.phone('#10243E',44)}<span><span class="t">Appeler ${esc(A)}</span><span class="s">Votre proche de confiance</span></span></button>
      <button type="button" class="big" data-act="push" data-arg="code">${ICON.key('#10243E')}<span><span class="t">Code famille</span><span class="s">Contre les faux proches</span></span></button>
      <div style="background:var(--sable);border-radius:20px;padding:16px 18px" class="col g4">
        <p style="font-size:17px;font-weight:700;color:var(--ocreTxt)">L’arnaque du moment</p>
        <p style="font-size:21px;font-weight:700">Le faux SMS de colis</p>
        <button type="button" class="link" data-act="tip" style="justify-content:flex-start">Comprendre en 1 minute</button>
      </div>
      <button type="button" class="link" data-act="push" data-arg="deja">J’ai déjà cliqué ou donné un code</button>
      </div></div>`,

    hist:()=>{ const n=st.history.length;
      return `<div class="scr pad col g16">
      ${topBack('Historique')}
      <div class="col g14 stg">
      <div class="navycard row g16"><div class="icirc" style="background:var(--ambre)">${n?ICON.warn('#10243E',30):ICON.check('#10243E',32)}</div>
        <div class="col g4"><p class="display" style="font-size:26px;line-height:32px">${n?(n===1?'1 arnaque évitée':n+' arnaques évitées'):'Aucune alerte'}</p><p style="font-size:18px;color:var(--brume)">Aujourd’hui</p></div></div>
      ${n?st.history.map(h=>{ const red=h.level==='arnaque';
        return `<button type="button" class="big" data-act="h-see" data-arg="${esc(h.id)}" style="min-height:88px;border-width:1px;border-color:var(--trait)">
          <span class="icirc" style="width:44px;height:44px;background:${red?'var(--rouge)':'var(--ambre)'}">${red?ICON.warn('#fff',24):ICON.info('#10243E',24)}</span>
          <span style="flex:1;min-width:0"><span class="t" style="font-size:20px;line-height:25px">${esc(h.title)}</span><span class="s">${esc(h.sub)} · ${hhmm(h.at)}</span></span>${ICON.chev('#10243E')}</button>`; }).join('')
        :`<p style="font-size:19px;line-height:27px">Quand GardeFou vous protège d’un message ou d’un appel, vous le retrouvez ici.</p>`}
      <p class="small muted">Seules les alertes sont gardées. Vos messages ne sont pas conservés.</p>
      </div></div>`; },

    analysing:()=>`<div class="scr col" style="background:var(--scrim);justify-content:flex-end">
      <div class="sheet rise" style="align-items:center;padding:40px 20px 56px;gap:18px;border-radius:26px 26px 0 0" role="status">
        <div class="spin"></div><p style="font-size:22px;font-weight:700">GardeFou lit ce message…</p>
        ${st.analysingNote?`<p class="muted" style="font-size:17px;text-align:center">${esc(st.analysingNote)}</p>`:''}
      </div></div>`,

    verdict:()=>{ const v=st.verdict, lv=v.level;
      const ic = lv==='arnaque'?`<div class="icirc" style="background:var(--rouge)">${ICON.warn('#fff',30)}</div>`: lv==='prudence'?`<div class="icirc" style="background:var(--ambre)">${ICON.info('#10243E',30)}</div>`:`<div class="icirc" style="background:var(--nuit)">${ICON.check('#FAF5EC',30)}</div>`;
      const title = lv==='arnaque'?'Arnaque probable':lv==='prudence'?'Prudence':'Rien à signaler';
      const color = lv==='arnaque'?'var(--rouge)':lv==='prudence'?'var(--ocreTxt)':'var(--nuit)';
      let btns='';
      if(lv==='arnaque') btns=`<button type="button" class="btn nuit" data-act="v-block">Bloquer l’expéditeur</button><button type="button" class="btn blanc" data-act="v-warn">Prévenir ${esc(A)}</button><button type="button" class="btn blanc" data-act="v-report">Signaler au 33700</button>`;
      else if(lv==='prudence') btns=`<button type="button" class="btn nuit" data-act="v-ask">Demander à ${esc(A)}</button><button type="button" class="btn blanc" data-act="v-delete">Supprimer le message</button>`;
      else btns=`<button type="button" class="btn nuit" data-act="back">C’est noté</button><button type="button" class="btn blanc" data-act="v-ask">Demander à ${esc(A)}</button>`;
      return `<div class="scr col" style="background:var(--scrim)">
        <div aria-hidden="true" style="flex:1;min-height:40px"></div>
        <div class="sheet" style="gap:16px;border-radius:26px 26px 0 0">
          <div class="row g14 drop">${ic}<p class="display" style="font-size:30px;line-height:36px;color:${color}">${title}</p></div>
          <p style="font-size:23px;line-height:30px;font-weight:700">${esc(v.consigne)}</p>
          <p style="font-size:19px;line-height:27px">${esc(v.raison)}</p>
          ${v.checks&&v.checks.length?`<button type="button" class="morelink" data-act="v-more">En savoir plus${ICON.chev('#10243E',20)}</button>`:''}
          ${v.code?`<button type="button" class="chip" data-act="push" data-arg="code" style="background:var(--sable);border:0;font-weight:700">${ICON.key('#10243E',28)}<span>Un faux proche ? Demandez-lui le code famille.</span></button>`:''}
          ${lv==='rien'?`<div style="background:var(--sable);border-radius:16px;padding:12px 14px"><p style="font-size:18px;line-height:24px">Un doute quand même ? Ne répondez pas et demandez à ${esc(A)}.</p></div>`:''}
          <div class="col g12">${btns}</div>
          ${lv!=='rien'?`<p class="small muted">${esc(A)} n’est prévenue que si vous le décidez.</p><button type="button" class="link" data-act="push" data-arg="deja">J’ai déjà cliqué ou répondu</button><button type="button" class="link" data-act="back">Fermer</button>`:''}
          <p class="small muted">${v.source==='ia'?'Lien vérifié par GardeFou, texte lu par l’IA. Le message n’est pas conservé.':'Lien et message vérifiés par GardeFou. Le message n’est pas conservé.'}</p>
        </div></div>`; },

    verify:()=>`<div class="scr pad col g16">
      ${topBack('Vérifier un message')}
      <div class="col g16 stg">
      <label class="lab" for="vtext">Collez ici le message douteux</label>
      <textarea id="vtext" placeholder="Appui long, puis « Coller »">${esc(st.verifyText)}</textarea>
      <button type="button" class="btn nuit" data-act="v-run">Analyser</button>
      <div class="col g8"><p class="muted" style="font-size:17px;font-weight:700">Ou essayez avec un exemple :</p>

    </div>`,

    code:()=>`<div class="scr pad col g18">
      ${topBack('Code famille')}
      <div class="col g18 stg">
      <p style="font-size:20px;line-height:28px">Quelqu’un se fait passer pour un proche au téléphone ou par message ? <strong>Demandez-lui le code famille.</strong> Un escroc ne le connaît pas, même avec une voix imitée.</p>

      <p class="small muted">Choisi par ${esc(A)} depuis son téléphone.</p></div>
    </div>`,

    deja:()=>{ const steps=[['Appeler ma banque',`Le numéro enregistré par ${A}`],['Bloquer ma carte','Faire opposition tout de suite'],['Changer mon mot de passe','Pas à pas, avec GardeFou'],[`Prévenir ${A}`,'Elle pourra vous aider']];
      return `<div class="scr pad col g16">
        <div class="row g8" style="min-height:48px"><button type="button" class="link" data-act="back" aria-label="Retour" style="min-width:48px;margin-left:-12px">${ICON.back('#10243E')}</button>${LOGO('#10243E','#BF6A00',26,35)}</div>
        <div class="col g16 stg">

        ${steps.map((s,i)=>{const d=st.dejaDone[i];return `<button type="button" class="step${d?' done':''}" data-act="d-step" data-arg="${i}"><span class="num">${d?ICON.check('#FAF5EC',22):(i+1)}</span><span style="flex:1"><span style="display:block;font-size:21px;font-weight:700">${esc(s[0])}</span><span style="display:block;font-size:17px;color:var(--ardoise)">${d?'Fait':esc(s[1])}</span></span>${ICON.chev('#10243E')}</button>`;}).join('')}
        <div style="background:var(--sable);border-radius:16px;padding:14px 16px" class="col g4"><p class="muted" style="font-size:17px">Vous avez perdu de l’argent ?</p><p style="font-size:19px;font-weight:700">Info Escroqueries : ${esc(CONFIG.infoEscroqueries)}</p></div>
        </div></div>`; },

    stop:()=>{ const bank=st.stopType==='banque';
      return `<div class="scr col stop">
        <div class="row g10 drop" style="align-self:flex-start;background:var(--rougeF);border-radius:16px;padding:10px 16px">${bank?ICON.phone('#fff',24):ICON.mic('#fff',24)}<p style="font-size:18px;font-weight:700">${bank?'Appel d’un numéro inconnu':'Résultat de l’analyse'}</p></div>
        <div class="col g10" style="margin-top:6px">${ICON.hand('#fff')}

          <p style="font-size:22px;line-height:30px">${bank?'Votre banque ne vous demande jamais de faire un virement pendant un appel.':'Cette personne vous demande un code. Votre banque ne le fait jamais.'}</p></div>
        <div class="col g14" style="margin-top:auto;padding-top:12px">
          <button type="button" class="btn blancR" data-act="s-ok" style="min-height:72px;font-size:24px">J’ai raccroché</button>
          <button type="button" class="btn ligneB" data-act="s-bank" style="min-height:72px;font-size:24px">Appeler ma vraie banque</button>
          <div class="row g10">${ICON.bell('#fff')}<p style="font-size:19px">${esc(A)} est prévenue.</p></div>
        </div></div>`; },

    onb1:()=>`<div class="scr col" style="background:var(--nuit);color:var(--creme);padding:40px 24px 28px">
      <div class="col g20 stg" style="flex:1;justify-content:center">
        <div style="width:96px;height:96px;border-radius:24px;overflow:hidden">${APPICON(96)}</div>
        <h1 class="display" style="font-size:38px;line-height:44px">Bienvenue dans GardeFou</h1>

        <p style="font-size:21px;line-height:30px">Si c’est une arnaque, GardeFou vous dit quoi faire et prévient ${esc(A)}.</p>
      </div>
      <div class="col g16"><div class="prog"><i class="on"></i><i></i><i></i></div><button type="button" class="btn ambre" data-act="onb" data-arg="onb2">Commencer</button></div></div>`,
    onb2:()=>`<div class="scr pad col">
      <div class="col g18 stg" style="flex:1">
        <h1 class="display" style="font-size:30px;line-height:36px;margin-top:12px">Autorisez la pastille</h1>
        <p style="font-size:20px;line-height:28px">Elle s’affiche dans vos applis de messages et d’appels. Elle ne lit rien sans votre appui.</p>
        <div class="card row g14" style="padding:20px"><button type="button" class="bulle" tabindex="-1" aria-hidden="true" style="cursor:default">${LOGO('#FAF5EC','#F2A33A',32,43)}</button><p style="font-size:19px;line-height:26px;font-weight:700">Un doute ? Appuyez ici</p></div>
        <div class="row g12 card"><span style="flex-shrink:0">${ICON.info('#10243E',28)}</span><p style="font-size:18px;line-height:25px">Android va vous demander une autorisation. Elle sert seulement à afficher la pastille.</p></div>
      </div>
      <div class="col g16" style="margin-top:20px"><div class="prog"><i></i><i class="on"></i><i></i></div><button type="button" class="btn nuit" data-act="onb-perm">Autoriser la pastille</button></div></div>`,
    onb3:()=>`<div class="scr pad col">
      <div class="col g18 stg" style="flex:1">
        <h1 class="display" style="font-size:30px;line-height:36px;margin-top:12px">Votre proche de confiance</h1>
        <div class="card row g14" style="padding:18px"><span class="av" style="background:var(--ambre);color:var(--nuit);width:56px;height:56px;border-radius:28px;font-size:24px">${esc(A.charAt(0))}</span><span class="col"><span style="font-size:22px;font-weight:700">${esc(A)}</span><span style="font-size:17px;color:var(--ardoise)">${esc(CONFIG.aidant.lien)}</span></span>${badge()}</div>
        <div class="col g12">
          <div class="row g12" style="align-items:flex-start">${ICON.bell('#10243E',28)}<p style="font-size:19px;line-height:27px">${esc(A)} est prévenue en cas de danger, ou quand vous le décidez.</p></div>
          <div class="row g12" style="align-items:flex-start">${ICON.msg('#10243E',28)}<p style="font-size:19px;line-height:27px">Elle ne voit jamais vos messages ni vos appels.</p></div>
          <div class="row g12" style="align-items:flex-start">${ICON.key('#10243E',28)}<p style="font-size:19px;line-height:27px">Elle choisit le code famille avec vous.</p></div>
        </div>
      </div>
      <div class="col g16" style="margin-top:20px"><div class="prog"><i></i><i></i><i class="on"></i></div><button type="button" class="btn nuit" data-act="onb-done">C’est d’accord</button></div></div>`
  };
  Object.assign(V, {
    ring:()=>callViews(st.call,{}).ring(),
    outcall:()=>callViews(st.call,{}).outcall(),
    call:()=>callViews(st.call,{bulle:st.call.who==='inconnu', banner: st.reply?`<div style="padding:0 20px 10px">${replyBanner()}</div>`:''}).call()
  });

  function after(fresh){
    const L=P.cur; if(!L) return;
    if(st.screen==='call'){ updTimer(); if(st.call&&st.call.who==='inconnu'&&st.call.state==='active') attachBulle(L,{act:'c-doubt', key:'appel', tip:fresh?'Un doute ?':'', oncall:true, defTop:250, minTop:(L.querySelector('.calltop')||{offsetHeight:180}).offsetHeight+12, bottomGap:230, label:'Faire analyser cet appel par GardeFou'}); }
    if(st.screen==='sms'){ // par défaut, la pastille se place juste sous le dernier message
      const msgs=L.querySelector('[data-msgs]'); const last=msgs&&msgs.lastElementChild;
      attachBulle(L,{act:'bulle', key:'msg', bottomGap:84, tip:fresh?'Un doute ? Appuyez ici':'', defTop: last?Math.max(110, last.offsetTop+last.offsetHeight+24):180, label:'Analyser ce message avec GardeFou'});
    }
    if(st.screen==='verify'){ const ta=L.querySelector('#vtext'); if(ta) ta.addEventListener('input',()=>{ st.verifyText=ta.value; }); }
    if(st.screen==='bank' && st.call && st.call.who==='inconnu' && st.call.state!=='ring'){
      setTimeout(()=>{ if(st.screen==='bank'&&st.call) toStop('banque'); }, 1100);
    }
  }
  function updTimer(){ const c=st.call; if(!c||!P.cur) return; const el=P.cur.querySelector('[data-slot="timer"]'); if(el) el.textContent=c.start?mmss(Date.now()-c.start):'00:00'; }

  /* ---------- appels ---------- */
  function startRinging(){ stopRinging(); SND.ringOnce(); ringTimer=setInterval(()=>SND.ringOnce(), 2600); }
  function stopRinging(){ clearInterval(ringTimer); ringTimer=null; try{ navigator.vibrate&&navigator.vibrate(0);}catch(e){} }
  function incomingCall(who, id){
    if(st.call) endCall(true);
    P.closeSheet(true); P.hideHun(true);
    st.call = who==='inconnu' ? {who:'inconnu', state:'ring', dir:'in'} : {who:'aidant', name:A, sub:CONFIG.aidant.lien+' · contact de confiance', state:'ring', dir:'in', id};
    push('ring','up'); startRinging();
  }
  function answer(){
    stopRinging(); const c=st.call; if(!c) return;
    c.state='active'; c.start=Date.now();
    if(c.who==='aidant') send({kind:'answer', id:uid(), at:Date.now(), ref:c.id||''});
    replaceTop('call','fade');
    clearInterval(callTimer); callTimer=setInterval(()=>{ updTimer(); syncPill(); },1000);
  }
  function endCall(silent){
    stopRinging(); clearInterval(callTimer); callTimer=null; clearTimeout(analyseTimer); clearTimeout(answerTimer);
    const c=st.call; st.call=null;
    if(c && c.who==='aidant' && !silent) send({kind:'hangup', id:uid(), at:Date.now()});
    P.pill(null);
  }
  function leaveCallScreens(anim){
    // retire les écrans d'appel de la pile et revient à l'écran précédent
    while(st.stack.length>1 && ['ring','outcall','call','stop'].includes(st.stack[st.stack.length-1])) st.stack.pop();
    if(!st.stack.length) st.stack=['launcher'];
    st.screen=st.stack[st.stack.length-1]; render(anim||'down');
  }
  function callJulie(){
    if(st.call) return;
    st.call={who:'aidant', name:A, sub:CONFIG.aidant.lien, state:'out', dir:'out', id:uid()};
    send({kind:'call', id:st.call.id, at:Date.now()});
    push('outcall','up');
    answerTimer=setTimeout(()=>{ // sans téléphone relié, l'appel est simulé
      if(st.call&&st.call.state==='out'&&!st.linked){ st.call.state='active'; st.call.start=Date.now(); replaceTop('call','fade'); callTimer=setInterval(()=>{ updTimer(); syncPill(); },1000); }
    }, 2600);
  }
  function toStop(type){
    clearTimeout(analyseTimer);
    st.stopType=type;
    if(st.stack[st.stack.length-1]==='bank'){ st.stack.push('stop'); st.screen='stop'; render('pop'); }
    else replaceTop('stop','pop');
    vib([300,120,300]);
    record({kind:type, level:'arnaque', title:type==='banque'?'Appli bancaire protégée':'Appel suspect arrêté', sub:CONFIG.appelInconnu.numero, intro:type==='banque'?'Vous avez ouvert votre banque pendant un appel inconnu.':'Vous avez demandé à GardeFou d’analyser l’appel.', checks:CALL_CHECKS[type]});
    alertAidant(type==='banque'?'banque':'appel');
  }

  /* ---------- analyse d'un message ---------- */
  async function analyse(text, fromSms){
    const c = fromSms ? convo() : null;
    const meta = c ? {from:c.name, sub:c.sub} : null;
    st.analysingNote = fromSms?'Vérification du lien et de l’expéditeur…':'Quelques secondes…';
    push('analysing','up');
    const t0=Date.now();
    const v = fromSms ? localVerdict(text, meta) : await aiVerdict(text);
    const wait = Math.max(0, CONFIG.dureeAnalyseMessage-(Date.now()-t0));
    setTimeout(()=>{ if(st.screen!=='analysing') return; st.verdict=v; st.verdictFrom=fromSms?text:null;
      if(v.level!=='rien') record({kind:'sms', level:v.level, title:v.level==='arnaque'?'Message frauduleux détecté':'Message douteux', sub:c?c.name:'Message vérifié', intro:v.raison, checks:v.checks});
      replaceTop('verdict','fade'); if(v.level==='arnaque') vib([80,60,80]); }, wait);
  }

  /* ---------- démo : réception d'un SMS ---------- */
  function receiveSms(key){
    const d=CONFIG.sms[key]; if(!d) return;
    const id='sms-'+key;
    st.convos=st.convos.filter(c=>c.id!==id);
    st.convos.unshift({id, name:d.from, sub:d.sub, known:d.sub==='Expéditeur connu', msgs:[{text:d.text, at:Date.now()}], unread:1});
    SND.ping();
    if(st.screen==='launcher'||st.screen==='inbox') refresh();
    P.hun({app:'Messages', icon:`<span class="av" style="width:40px;height:40px;background:#ECEFF3">${ICON.bubble('#2F5E99',22)}</span>`, title:d.from, text:d.text, onTap:()=>openConvo(id)});
  }
  function openConvo(id){
    const c=st.convos.find(x=>x.id===id); if(!c) return; c.unread=0; st.convoId=id;
    if(st.screen==='ring'||st.screen==='stop') return;
    if(st.screen==='sms') { replaceTop('sms','fade'); return; }
    if(st.screen==='inbox') { push('sms'); return; }
    st.stack=['launcher','inbox','sms']; st.screen='sms'; render('push');
  }

  /* ---------- commandes de démonstration ---------- */
  function openDemo(){
    const inCall = st.call && st.call.who==='inconnu' && st.call.state!=='ring';
    const w=P.sheet(`<div class="row" style="justify-content:space-between"><p class="demohead">Simulation</p><button type="button" class="gear" data-d="dev" aria-label="Réglages de la démo">${ICON.gear('#3D5068')}</button></div>
      <p class="small muted">Ce qui arrive sur le téléphone de ${esc(S)}.</p>
      <button type="button" class="chip" data-d="sms-colis">${ICON.bubble('#10243E',24)}<span>Recevoir un faux SMS de colis</span></button>
      <button type="button" class="chip" data-d="sms-proche">${ICON.bubble('#10243E',24)}<span>Recevoir un SMS d’un faux proche</span></button>
      <button type="button" class="chip" data-d="sms-pharma">${ICON.bubble('#10243E',24)}<span>Recevoir un SMS normal</span></button>
      <button type="button" class="chip" data-d="call">${ICON.phone('#10243E',24)}<span>Recevoir un appel d’un numéro inconnu</span></button>
      ${inCall?`<button type="button" class="chip" data-d="bank">${ICON.bank('#10243E',24)}<span>Pendant l’appel : ouvrir l’appli bancaire</span></button>`:''}
      <button type="button" class="btn nuit" data-d="close">Fermer</button>`, 'Simulation');
    w.addEventListener('click', e=>{ const b=e.target.closest('[data-d]'); if(!b) return; const d=b.dataset.d;
      if(d==='dev'){ devPanel(P, true, k=>devAction(k)); return; }
      P.closeSheet();
      if(['sms-colis','sms-proche','sms-pharma','call'].includes(d)) st.reply=null;
      if(d.startsWith('sms-')) setTimeout(()=>receiveSms(d.slice(4)), 1300);
      else if(d==='call') setTimeout(()=>incomingCall('inconnu'), 1300);
      else if(d==='bank'){ st.stack=['launcher','bank']; st.screen='bank'; render('open'); }
    });
  }
  function devAction(k){
    if(k==='onb') resetTo(['onb1'],'fade');
    else if(k==='reset'){ endCall(true); Object.assign(st,{reply:null,dejaDone:{},verifyText:'',showWord:false,verdict:null,history:[]}); resetConvos(); send({kind:'reset', id:uid(), at:Date.now()}); resetTo(['launcher'],'fade'); P.toast('Démo remise à zéro'); }
    else if(k==='quit'){ endCall(true); store.set('role',''); location.hash=''; }
  }

  /* ---------- actions ---------- */
  P.stage.addEventListener('click', e=>{
    const b=e.target.closest('[data-act]'); if(!b||!P.stage.contains(b)) return;
    const a=b.dataset.act, arg=b.dataset.arg;
    switch(a){
      case 'back': back(); break;
      case 'push': push(arg); break;
      case 'open':
        if(arg==='home'){ st.stack=['launcher','home']; st.screen='home'; render('open'); }
        else { st.stack=['launcher',arg]; st.screen=arg; render('open'); }
        break;
      case 'convo': openConvo(arg); break;
      case 'v-more': detailsSheet(P, 'Ce que GardeFou a vérifié', st.verdictFrom?'Le lien, le site, l’expéditeur et le texte du message.':'Le lien et le texte du message.', st.verdict.checks); break;
      case 'h-see': { const h=st.history.find(x=>x.id===arg); if(h) detailsSheet(P, h.title, h.intro, h.checks); break; }
      case 'tip': P.sheet(`<p class="display" style="font-size:26px;line-height:32px">Le faux SMS de colis</p>
        <p style="font-size:19px;line-height:27px">1. Un message dit qu’un colis attend et qu’il faut payer quelques euros.</p>
        <p style="font-size:19px;line-height:27px">2. Le lien mène à un faux site qui vole votre carte bancaire.</p>
        <p style="font-size:19px;line-height:27px;font-weight:700">Un livreur ne vous fait jamais payer par SMS. Ne cliquez pas.</p>
        <button type="button" class="btn nuit" data-act="sheet-close">J’ai compris</button>`,'Le faux SMS de colis').addEventListener('click',ev=>{ if(ev.target.closest('[data-act="sheet-close"]')) P.closeSheet(); }); break;
      case 'bulle': { const c=convo(); if(c) analyse(c.msgs[c.msgs.length-1].text, true); break; }
      case 'v-block': { st.convos=st.convos.filter(c=>c.id!==st.convoId); st.stack=['launcher','inbox']; st.screen='inbox'; render('down'); P.toast('Expéditeur bloqué.'); break; }
      case 'v-warn': alertAidant('sms', st.verdict.raison); P.toast(A+' est prévenue.'); break;
      case 'v-report': P.toast('Message signalé au 33700 (simulation).'); break;
      case 'v-ask': alertAidant('doute',''); P.toast(A+' est prévenue.'); break;
      case 'v-delete': { st.convos=st.convos.filter(c=>c.id!==st.convoId); if(st.verdictFrom){ st.stack=['launcher','inbox']; st.screen='inbox'; render('down'); } else back(); P.toast('Message supprimé.'); break; }
      case 'v-ex': st.verifyText=CONFIG.exemples[+arg][1]; refresh(); break;
      case 'v-run': { const t=(P.cur.querySelector('#vtext')||{}).value||''; if(!t.trim()){ P.toast('Collez d’abord un message.'); break; } st.verifyText=t; analyse(t.trim(), false); break; }
      case 'code-toggle': st.showWord=!st.showWord; refresh(); break;
      case 'd-step': { const i=+arg; if(st.dejaDone[i]) break; st.dejaDone[i]=true; if(i===3){ alertAidant('clique',''); P.toast(A+' est prévenue.'); } else P.toast(['Appel de votre banque (simulation).','Opposition demandée (simulation).','Changement du mot de passe guidé (simulation).'][i]); refresh(); break; }
      case 'call-julie': callJulie(); break;
      case 'reply-ok': st.reply=null; refresh(); break;
      case 'fake-call': P.toast('Appel simulé : seul l’appel à '+A+' est relié.'); break;
      case 'bank-op': P.toast('Fonction de la banque non simulée.'); break;
      case 'call-answer': answer(); break;
      case 'call-decline': endCall(); leaveCallScreens('down'); break;
      case 'call-hangup': endCall(); leaveCallScreens('down'); P.toast('Appel terminé.'); break;
      case 'c-doubt': st.call.state='analysing'; refresh(); analyseTimer=setTimeout(()=>{ if(st.call&&st.call.state==='analysing'&&st.screen==='call') toStop('appel'); }, CONFIG.dureeAnalyseAppel); break;
      case 'c-stopan': clearTimeout(analyseTimer); st.call.state='active'; refresh(); break;
      case 'c-spk': st.call.spk=!st.call.spk; refresh(); break;
      case 'c-mute': st.call.mute=!st.call.mute; refresh(); break;
      case 's-ok': endCall(true); resetTo(['launcher','home'],'fade'); P.toast('Bien joué. '+A+' va vous rappeler.'); break;
      case 's-bank': P.toast('Appel de votre banque au numéro enregistré par '+A+' (simulation).'); break;
      case 'onb': replaceTop(arg,'push'); break;
      case 'onb-perm': { const w=document.createElement('div'); w.className='sheetwrap'; w.style.justifyContent='center'; w.innerHTML=`<div class="sysdlg" role="dialog" aria-label="Autorisation Android"><div class="row g12" style="margin-bottom:10px"><span style="width:36px;height:36px;border-radius:9px;overflow:hidden;display:block">${APPICON(36)}</span><p style="font-size:15px;color:#57606A">Paramètres Android</p></div><p style="font-size:21px;line-height:28px;font-weight:700">Autoriser GardeFou à s’afficher par-dessus les autres applis ?</p><div class="acts"><button type="button" data-p="no">Refuser</button><button type="button" data-p="ok">Autoriser</button></div></div>`;
        P.stage.appendChild(w); w.addEventListener('click',ev=>{ const p=ev.target.closest('[data-p]'); if(!p) return; w.remove(); if(p.dataset.p==='ok') replaceTop('onb3','push'); else P.toast('Sans la pastille, GardeFou ne peut pas vous aider pendant un appel.'); }); break; }
      case 'onb-done': store.set('onb','1'); resetTo(['launcher'],'fade'); break;
    }
  });

  /* ---------- démarrage ---------- */
  P.splash(()=>{ if(store.get('onb','')!=='1'){ st.stack=['onb1']; st.screen='onb1'; } render('fade'); });
  setInterval(()=>{ if(st.screen==='launcher'&&P.cur){ const c=P.cur.querySelector('[data-slot="bigclock"]'); if(c) c.textContent=hhmm(Date.now()); } }, 5000);

  return {
    receive(m, old){
      if(m.kind==='reply'){ if(old) return; st.reply=m.text; SND.ping(); P.hun({app:'GardeFou', icon:`<span style="width:40px;height:40px;border-radius:10px;overflow:hidden;display:block;flex-shrink:0">${APPICON(40)}</span>`, title:A+' vous écrit', text:m.text, onTap:()=>{ if(st.screen!=='home'&&st.screen!=='call'&&st.screen!=='stop') resetTo(['launcher','home'],'open'); }}); if(st.screen==='home'||st.screen==='call') refresh(); }
      else if(m.kind==='word'){ st.word=m.word; if(st.screen==='code') refresh(); }
      else if(m.kind==='call'){ if(old) return; incomingCall('aidant', m.id); }
      else if(m.kind==='answer'){ if(old) return; const c=st.call; if(c&&c.state==='out'){ clearTimeout(answerTimer); c.state='active'; c.start=Date.now(); replaceTop('call','fade'); clearInterval(callTimer); callTimer=setInterval(()=>{ updTimer(); syncPill(); },1000); } }
      else if(m.kind==='hangup'){ if(old) return; if(st.call&&st.call.who==='aidant'){ endCall(true); if(['ring','outcall','call'].includes(st.screen)) leaveCallScreens('down'); P.toast('Appel terminé.'); } }
    },
    linked(v){ if(st.linked!==v){ st.linked=v; if(['home','onb3'].includes(st.screen)) refresh(); } },
    busy(){ return !!st.call || ['stop','analysing','verdict','ring','outcall','call'].includes(st.screen); },
    toast(t){ P.toast(t); }
  };
}

/* =====================================================================
   5. TÉLÉPHONE DE L'AIDANTE (Julie)
   ===================================================================== */
function createAidant(host, send){
  const st={screen:'dash', stack:['dash'], linked:false, history:[], current:null, word:store.get('word',CONFIG.codeFamille), soundOn:false, call:null, fresh:null};
  let callTimer=null, ringTimer=null, openTimer=null, answerTimer=null;
  const P = makePhone(host, {back, home:goHome, menu:openDemo});
  const THEME={dash:['creme'], alert:['nuit'], offres:['creme'], ring:['os'], outcall:['os'], call:['os']};
  const MODAL={alert:1, ring:1, outcall:1, call:1};
  function render(anim){ const t=THEME[st.screen]||['creme']; P.theme(t[0],t[1]||t[0]); P.show(V[st.screen](), anim); after(); syncPill(); }
  function refresh(){ P.refresh(V[st.screen]()); after(); syncPill(); }
  function push(s, anim='push'){ st.stack.push(s); st.screen=s; render(anim); }
  function replaceTop(s, anim='fade'){ st.stack[st.stack.length-1]=s; st.screen=s; render(anim); }
  function back(){ if(P.sheetOpen()) return P.closeSheet(); if(['ring'].includes(st.screen)) return; if(st.screen==='call'||st.screen==='outcall'){ goHome(); return; } if(st.stack.length>1){ const top=st.stack.pop(); st.screen=st.stack[st.stack.length-1]; render(MODAL[top]?'down':'back'); } }
  function goHome(){ if(P.sheetOpen()) P.closeSheet(true); if(st.screen==='ring'||st.screen==='dash') return; st.stack=['dash']; st.screen='dash'; render('fade'); }
  function syncPill(){ const c=st.call; if(c&&c.state!=='ring'&&!['call','outcall','ring'].includes(st.screen)) P.pill('Appel en cours · '+(c.start?mmss(Date.now()-c.start):'…'), ()=>push(c.start?'call':'outcall','up')); else P.pill(null); }

  const V={
    dash:()=>`<div class="scr pad col g18">
      <div class="row g12" style="min-height:48px">${LOGO('#10243E','#BF6A00',28,38)}<p class="display" style="font-size:24px">GardeFou</p><span class="badge${st.linked?'':' off'}" style="margin-left:auto"><i></i>${st.linked?'Relié à '+esc(SU):'Non relié'}</span></div>
      <div class="col g18 stg">
      <div class="navycard row g16">
        <div class="icirc" style="background:var(--ambre)">${ICON.check('#10243E',32)}</div>
        <div class="col g4"><p class="display" style="font-size:26px;line-height:32px">${esc(SU)} est protégée</p><p style="font-size:18px;color:var(--brume)">GardeFou est actif sur son téléphone.</p></div>
      </div>
      ${st.soundOn?'':`<button type="button" class="btn ambre" data-act="sound">${ICON.bell('#10243E')}<span>Activer le son des alertes</span></button>`}
      <div class="col g10"><h2 style="font-size:20px">Alertes</h2>
        <div class="card" style="padding:4px 18px">${st.history.length?st.history.slice().reverse().map(h=>{ const c=ALERT_COPY[h.type]; return `<button type="button" class="hist${h.id===st.fresh?' new':''}" data-act="see" data-arg="${esc(h.id)}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;padding:13px 8px;margin:0 -8px;border-bottom:1px solid #EDE5D6;border-radius:10px;width:calc(100% + 16px)"><span class="dot" style="background:${c.urgent?'#B42318':'#10243E'};${c.urgent?'':'border-radius:7px'}"></span><span class="col"><span style="font-size:19px;line-height:25px;font-weight:700">${esc(c.hist)}</span><span style="font-size:17px;line-height:22px;color:#3D5068">Aujourd’hui, ${hhmm(h.at)}</span></span></button>`; }).join(''):`<p style="font-size:18px;line-height:25px;padding:14px 0;color:#3D5068">Aucune alerte pour l’instant. Vous serez prévenue en direct.</p>`}</div></div>
      <div class="col g10"><h2 style="font-size:20px">Réglages</h2>
        <div class="card col g10">
          <label class="lab" for="word">Code famille</label>
          <div class="row g10"><input type="text" id="word" maxlength="24" autocomplete="off" value="${esc(st.word)}"><button type="button" class="btn nuit" data-act="word" style="width:auto;min-height:56px;font-size:18px">Enregistrer</button></div>
          <p class="small muted">${esc(SU)} le voit dans son appli. Ne l’envoyez jamais par message.</p>
        </div>
        <button type="button" class="big" data-act="push" data-arg="offres" style="min-height:72px;justify-content:space-between"><span><span class="t" style="font-size:20px">Abonnement</span><span class="s">Famille, annuel</span></span>${ICON.chev('#10243E')}</button>
      </div>
      <p class="small muted">Vous ne voyez jamais ses messages, seulement les alertes.</p>
      </div></div>`,

    alert:()=>{ const m=st.current, c=ALERT_COPY[m.type];
      return `<div class="scr col g20" style="background:var(--nuit);color:var(--creme);padding:28px 22px 24px" role="alertdialog" aria-labelledby="atitle">
        <div class="row g12 drop">${LOGO('#FAF5EC','#F2A33A',28,38)}<p style="font-size:18px;font-weight:700;color:var(--ambre)">Alerte GardeFou · ${hhmm(m.at)}</p></div>
        <div class="col g20 stg">
