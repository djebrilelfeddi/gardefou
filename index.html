/* =====================================================================
   6. LIAISON ENTRE LES DEUX TÉLÉPHONES (en direct, via la page partagée)
   ===================================================================== */
const KINDS=['alert','reply','call','answer','hangup','reset'], TYPES=Object.keys(ALERT_COPY);
function cleanItem(x){
  if(!x||typeof x!=='object') return null;
  const id=typeof x.id==='string'&&/^[a-z0-9]{6,24}$/.test(x.id)?x.id:null; if(!id||!KINDS.includes(x.kind)) return null;
  const at=typeof x.at==='number'&&isFinite(x.at)?x.at:Date.now();
  if(x.kind==='alert') return TYPES.includes(x.type)?{kind:'alert',id,at,type:x.type,detail:typeof x.detail==='string'?x.detail.slice(0,160):''}:null;
  if(x.kind==='reply') return typeof x.text==='string'?{kind:'reply',id,at,text:x.text.slice(0,80)}:null;
  return {kind:x.kind,id,at};
}
/* état de la liaison, affiché dans le menu □ pour comprendre un souci */
const FB = (window.GARDEFOU_FIREBASE && window.GARDEFOU_FIREBASE.databaseURL) ? window.GARDEFOU_FIREBASE : null;
const DIAG={etape:'Démarrage', via:'', salle:'', appareils:0, partenaire:false, erreur:'', fb:''};
function diagText(){
  if(DIAG.partenaire) return 'Liaison active'+(DIAG.via?' ('+DIAG.via+')':'')+'.';
  if(FB) return (DIAG.fb||'Connexion à Firebase…')+' · en attente de l’autre téléphone (même code ?)';
  return DIAG.etape+(DIAG.salle?' · '+DIAG.salle:'')+(DIAG.appareils?' · '+DIAG.appareils+' appareil(s) vu(s)':'')+(DIAG.erreur?' · code '+DIAG.erreur:'');
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FIREBASE_SDK='https://www.gstatic.com/firebasejs/10.12.2/';
function connectLink(role, code, app, status){
  const other = role==='senior'?'aidant':'senior';
  const items=[]; let word=role==='aidant'?app.word():null; const seen=new Set(); let lastWord=null; const t0=Date.now();
  let grp=null, lobby=null, bc=null, fbWrite=null, bcLinked=false, roomLinked=false, fbSeenAt=0, emitSeen=0;
  const handle=(raw)=>{ const it=cleanItem(raw); if(!it||seen.has(it.id)) return; seen.add(it.id); const old=(Date.now()-it.at>90000)||(it.at<t0-5000); app.receive(it, old); };
  const handleWord=(w)=>{ if(role==='senior'&&typeof w==='string'&&w.trim()&&w!==lastWord){ lastWord=w.slice(0,24); app.receive({kind:'word',word:lastWord}); } };
  const setLinked=()=>{ const em=(Date.now()-emitSeen<12000), fbLinked=(Date.now()-fbSeenAt<15000); const v=fbLinked||roomLinked||bcLinked||em;
    DIAG.via = fbLinked?'Firebase':(roomLinked||em)?'claude.ai':bcLinked?'même appareil':'';
    DIAG.partenaire=v; app.linked(v); };
  const state=()=>{ const p={role, code, items:items.slice(-6)}; if(role==='aidant') p.word=word||''; return p; };
  const push=()=>{ const p=state();
    if(fbWrite) fbWrite(p);
    if(grp) grp.presence(p).catch(e=>{ DIAG.erreur=(e&&e.code)||'presence'; });
    if(lobby) lobby.emit('gf', p).catch(()=>{});
    if(bc) try{ bc.postMessage({from:role, ...p}); }catch(e){} };
  const take=(pr)=>{ if(!pr||pr.role!==other||pr.code!==code) return false; const it=pr.items; (Array.isArray(it)?it:(it&&typeof it==='object'?Object.values(it):[])).forEach(handle); handleWord(pr.word); return true; };

  /* 1. Firebase : deux téléphones, n'importe où, avec internet */
  if(FB){ (async()=>{
    try{
      DIAG.fb='Connexion à Firebase…';
      const fa=await import(FIREBASE_SDK+'firebase-app.js');
      const fd=await import(FIREBASE_SDK+'firebase-database.js');
      const fapp=fa.initializeApp(FB, 'gardefou');
      const db=fd.getDatabase(fapp);
      const mine=fd.ref(db,'gardefou/'+code+'/'+role), theirs=fd.ref(db,'gardefou/'+code+'/'+other);
      fbWrite=p=>fd.set(mine,{...p, t:Date.now(), online:true}).catch(e=>{ DIAG.fb='Écriture refusée par Firebase (vérifiez les règles)'; });
      fd.onValue(fd.ref(db,'.info/connected'), s=>{ if(s.val()===true){ DIAG.fb='Firebase connecté'; fd.onDisconnect(mine).update({online:false}).catch(()=>{}); push(); } else DIAG.fb='Firebase : connexion perdue, nouvelle tentative…'; });
      fd.onValue(theirs, s=>{ const d=s.val(); if(d&&d.online!==false&&take(d)) fbSeenAt=Date.now(); else fbSeenAt=0; setLinked(); }, ()=>{ DIAG.fb='Lecture refusée par Firebase (vérifiez les règles)'; });
      push();
    }catch(e){ DIAG.fb='Firebase injoignable (pas d’internet ?)'; }
  })(); }

  /* 2. même appareil, deux onglets : canal local */
  try{ bc=new BroadcastChannel('gardefou-'+code); bc.onmessage=e=>{ const d=e.data||{}; if(d.from!==other) return; if(!bcLinked){ bcLinked=true; setLinked(); push(); } take({...d, role:d.from}); }; }catch(e){ bc=null; }
  push();

  /* 3. page claude.ai : salle partagée (utilisée seulement si la page tourne dans claude.ai) */
  (async()=>{
    DIAG.etape='Attente de claude.ai';
    for(let i=0;i<100&&!(window.claude&&typeof window.claude.use==='function');i++) await sleep(100);
    if(!(window.claude&&typeof window.claude.use==='function')){ DIAG.etape='Pas de liaison claude.ai'; if(!FB) status('off'); return; }
    let room=null; try{ room=await window.claude.use('room'); }catch(e){ DIAG.erreur=(e&&e.code)||'use'; }
    if(!room){ DIAG.etape='Salle refusée (compte sans accès à la page ?)'; if(!FB) status('off'); return; }
    lobby=room;
    try{ grp=await room.join('gardefou-'+code); DIAG.salle='salle « '+code+' »'; }
    catch(e){ DIAG.erreur=(e&&e.code)||'join'; grp=room; DIAG.salle='salle commune'; }
    DIAG.etape='Connecté, en attente de l’autre téléphone';
    status('on'); push();
    grp.onPeers(ch=>{
      let linked=false; DIAG.appareils=ch.peers.length;
      for(const peer of ch.peers){ if(peer.sameTab) continue; if(take(peer.presence||{})) linked=true; }
      roomLinked=linked; setLinked();
      if(ch.joined && ch.joined.length) push();
    }, e=>{ DIAG.etape='Salle interrompue'; DIAG.erreur=(e&&e.code)||''; roomLinked=false; setLinked(); });
    try{ room.on('gf', msg=>{ if(msg.sameTab) return; if(take(msg.data||{})){ emitSeen=Date.now(); setLinked(); } }); }catch(e){}
  })();
  setInterval(()=>{ push(); setLinked(); }, 4000);   // rappel régulier : un téléphone arrivé en retard se met à jour
  return { send(m){ if(m.kind==='word') word=m.word; else { items.push(m); while(items.length>6) items.shift(); } push(); } };
}

/* =====================================================================
   7. MISES À JOUR : GitHub publie version.json, l'appli le surveille
   ===================================================================== */
const APP_VERSION='__APP_VERSION__';
const DEV = APP_VERSION.indexOf('APP_VERSION')>=0;
const APPS=[];                                      // téléphones affichés, pour savoir si une démo est en cours
const busy=()=>APPS.some(a=>a.busy&&a.busy());
let pendingUpdate=null, hiddenAt=0, updBar=null;
async function fetchVersion(){
  if(DEV || !/^https?:$/.test(location.protocol)) return null;
  try{ const r=await fetch('version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return null; const v=await r.json(); return (v&&typeof v.version==='string')?v:null; }catch(e){ return null; }
}
async function applyUpdate(v){
  if(v) store.set('upd', v.version);
  try{ if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.filter(k=>k.startsWith('gardefou-')).map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update().catch(()=>{}))); } }catch(e){}
  const target = v ? '?v='+encodeURIComponent(v.version) : location.search;   // l'adresse change : aucun cache ne peut resservir l'ancienne version
  location.replace(location.pathname + target + location.hash);
}
function showUpdateBar(v){
  if(updBar) updBar.remove();
  updBar=document.createElement('div');
  updBar.setAttribute('role','status');
  updBar.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:200;max-width:460px;margin:0 auto;background:var(--nuit);color:var(--creme);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.3);animation:rise .4s var(--E) both;font-family:inherit';
  updBar.innerHTML=`<div class="col g4" style="flex:1;min-width:0"><p style="font-size:18px;font-weight:700">Nouvelle version ${esc(v.version)}</p><p style="font-size:15px;color:var(--brume)" class="ellip">${esc(v.notes||'Mise à jour disponible')}</p></div><button type="button" data-u="later" style="all:unset;cursor:pointer;font-size:16px;color:var(--brume);padding:10px 6px">Plus tard</button><button type="button" data-u="go" style="all:unset;cursor:pointer;background:var(--ambre);color:var(--nuit);font-size:17px;font-weight:700;padding:12px 16px;border-radius:14px">Mettre à jour</button>`;
  updBar.addEventListener('click',e=>{ const b=e.target.closest('[data-u]'); if(!b) return; if(b.dataset.u==='go') applyUpdate(v); else { updBar.remove(); updBar=null; } });
  document.body.appendChild(updBar);
}
/* auto : au démarrage et au retour dans l'appli, on installe tout seul si aucune démo n'est en cours ;
   sinon une bannière propose la mise à jour. manuel : bouton dans le menu □. */
async function checkUpdate(mode){
  const v=await fetchVersion();
  if(!v){ if(mode==='manual') toastAll(DEV?'Version de développement : pas de mise à jour.':'Impossible de vérifier (pas d’internet ?).'); return; }
  if(v.version===APP_VERSION){ store.set('upd',''); if(mode==='manual') toastAll('Vous avez la dernière version ('+APP_VERSION+').'); return; }
  pendingUpdate=v;
  const dejaTente = store.get('upd','')===v.version;          // évite de recharger en boucle si GitHub n'a pas fini de publier
  if(mode==='manual' || (!dejaTente && (mode==='start' || (mode==='resume' && !busy())))) return applyUpdate(v);
  showUpdateBar(v);
}
function toastAll(t){ APPS.forEach(a=>a.toast&&a.toast(t)); if(!APPS.length) try{ alertBox(t); }catch(e){} }
function alertBox(t){ const p=document.querySelector('.hub [data-msg]'); if(p) p.textContent=t; }
window.GF_UPDATE=()=>checkUpdate('manual');
document.addEventListener('visibilitychange',()=>{ if(document.hidden) hiddenAt=Date.now(); else if(hiddenAt && Date.now()-hiddenAt>30000) checkUpdate('resume'); });
setInterval(()=>checkUpdate('auto'), 3*60*1000);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') && !DEV){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }

const standalone = ()=> matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
function getCode(){ const c=(store.get('code','demo')||'demo').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20); return c||'demo'; }
let wakeLock=null;
function goFull(){
  try{ const el=document.documentElement; if(!document.fullscreenElement){ const r=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null); if(r&&r.catch) r.catch(()=>{}); } }catch(e){}
  try{ if(navigator.wakeLock&&!wakeLock) navigator.wakeLock.request('screen').then(w=>{wakeLock=w; w.addEventListener('release',()=>{wakeLock=null;});}).catch(()=>{}); }catch(e){}
}
function fit(desk){
  const f=()=>{ desk.style.transform='none'; const w=desk.offsetWidth, h=desk.offsetHeight; const s=Math.min(1,(innerWidth-32)/w,(innerHeight-32)/h); desk.style.transform=`scale(${s})`; };
  f(); window.onresize=f;
}

function hub(){
  window.onresize=null; appEl.className=''; appEl.textContent='';
  const box=document.createElement('div'); box.className='hub';
  box.innerHTML=`<div class="row g14"><span style="width:56px;height:56px;border-radius:14px;overflow:hidden;display:block;flex-shrink:0">${APPICON(56)}</span><div class="col"><p class="display" style="font-size:30px;line-height:34px">GardeFou</p><p class="muted" style="font-size:17px">Prototype · Hackathon 36h Chrono</p></div></div>
    <p style="font-size:19px;line-height:27px">L’anti-arnaque qui protège toute la famille. Ce téléphone joue le rôle de :</p>
    <button type="button" class="btn nuit" data-go="monique" style="min-height:72px">${esc(S)}, la personne protégée</button>
    <button type="button" class="btn blanc" data-go="julie" style="min-height:72px">${esc(A)}, l’aidante</button>
    <button type="button" class="btn" data-go="duo" style="background:var(--sable)">Les deux téléphones sur cet écran</button>
    <div class="col g8" style="border-top:1px solid var(--trait);padding-top:16px">
      <label class="lab" for="code">Code de la démo</label>
      <input type="text" id="code" maxlength="20" autocomplete="off">
      <p class="small muted">${FB?'Même code sur les deux téléphones pour les relier en direct. Il faut une connexion internet.':'Même code sur les deux téléphones pour les relier en direct.'}</p>
    </div>
    <div class="row g10" style="justify-content:space-between;border-top:1px solid var(--trait);padding-top:12px"><p class="small muted" data-msg>Version ${esc(DEV?'de développement':APP_VERSION)}</p><button type="button" class="link" data-maj style="min-height:40px;font-size:17px">Mettre à jour</button></div>`;
  appEl.appendChild(box);
  const ci=box.querySelector('#code'); ci.value=getCode();
  ci.addEventListener('change',()=>{ store.set('code',ci.value); ci.value=getCode(); });
  box.querySelector('[data-maj]').addEventListener('click',()=>checkUpdate('manual'));
  box.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(!b) return; store.set('code',ci.value); store.set('role',b.dataset.go); unlockAudio(); if(isSmall()&&!standalone()) goFull(); internalNav=true; location.hash=b.dataset.go; });
}
function single(role){
  appEl.textContent='';
  const full=isSmall();
  appEl.className=full?'full':'';
  const d=device(role==='senior'?'Téléphone de '+S:'Téléphone de '+A);
  const stat=document.createElement('p'); stat.className='caption'; stat.style.fontWeight='500'; stat.textContent='Code « '+getCode()+' »';
  if(full){ appEl.appendChild(d.phone); }
  else { const desk=document.createElement('div'); desk.className='desk'; desk.append(d.wrap, stat); appEl.appendChild(desk); fit(desk); }
  let link=null; const outbox=[];
  const send=m=>{ if(link) link.send(m); else outbox.push(m); };
  const app = role==='senior'? createSenior(d.phone, send) : createAidant(d.phone, send);
  APPS.push(app);
  link = connectLink(role, getCode(), app, s=>{ if(s==='off'&&!FB) stat.textContent='Code « '+getCode()+' » · liaison indisponible ici'; });
  outbox.splice(0).forEach(m=>link.send(m));
}
function duo(){
  appEl.className=''; appEl.textContent='';
  const a=device('Téléphone de '+S), b=device('Téléphone de '+A);
  const desk=document.createElement('div'); desk.className='desk';
  const pair=document.createElement('div'); pair.className='pair'; pair.append(a.wrap,b.wrap);
  const bar=document.createElement('div'); bar.className='deskbar';
  bar.innerHTML=`<button type="button" class="link" data-x="full">Plein écran</button><button type="button" class="link" data-x="quit">Changer de mode</button>`;
  bar.addEventListener('click',e=>{ const x=e.target.closest('[data-x]'); if(!x) return; if(x.dataset.x==='full') goFull(); else { store.set('role',''); location.hash=''; } });
  desk.append(pair, bar); appEl.appendChild(desk); fit(desk);
  let senior, aidant;
  senior=createSenior(a.phone, m=>{ setTimeout(()=>aidant.receive(m,false),400); });
  aidant=createAidant(b.phone, m=>{ setTimeout(()=>senior.receive(m,false),400); });
  APPS.push(senior, aidant);
  senior.receive({kind:'word', word:aidant.word()});
  senior.linked(true); aidant.linked(true);
}
function route(){
  let h=(location.hash||'').replace('#','');
  if(!h && standalone()){ const r=store.get('role',''); if(['monique','julie'].includes(r)){ h=r; history.replaceState(null,'','#'+r); } }  // appli installée : on rouvre le dernier rôle
  if(h==='monique') single('senior'); else if(h==='julie') single('aidant'); else if(h==='duo') duo(); else hub();
}
let internalNav=false;
window.addEventListener('hashchange', ()=>{ if(internalNav){ internalNav=false; route(); } else location.reload(); });
route();
checkUpdate('start');
})();
</script>
</body>
</html>
